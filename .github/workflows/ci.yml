name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Public launch module syntax
        run: npm run lint:launch
      - name: Tests
        run: npm test
      - name: Build check
        run: npm run build
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Mobile typecheck and tests
        run: npm run mobile:check
