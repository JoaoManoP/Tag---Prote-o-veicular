name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_database_changes:
        description: Confirmo revisão, backup e aplicação das mudanças críticas de banco
        required: false
        default: false
        type: boolean
      approve_manifest_bootstrap:
        description: Confirmo a substituição única da estrutura legada pelo primeiro manifesto da release
        required: false
        default: false
        type: boolean
      provision_staff:
        description: Atualizar explicitamente as contas administrativas nesta publicação
        required: false
        default: false
        type: boolean
      approve_server_overwrite:
        description: Confirmo que arquivos alterados diretamente na VPS após o último deploy podem ser sobrescritos por esta release (backup do banco é feito antes; .env, dados e backups são preservados)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Classify release impact
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_CHANGES_APPROVED: ${{ inputs.approve_database_changes || false }}
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-vps.yml/runs?status=success&per_page=30")"
          BASE_SHA="$(jq -r --arg head "$CANDIDATE_SHA" '[.workflow_runs[] | select(.head_sha != $head)][0].head_sha // empty' <<<"$RUNS")"
          test -n "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          DATABASE_IMPACT="$(node deploy/release-manifest.mjs create \
            --root "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "$CANDIDATE_SHA" \
            --output rastreon-release-manifest.json)"
          BASE_DIR="$(mktemp -d)"
          trap 'git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          node deploy/release-manifest.mjs create \
            --root "$BASE_DIR" \
            --base "$BASE_SHA" \
            --head "$BASE_SHA" \
            --output rastreon-published-manifest.json >/dev/null
          {
            echo "## Release preflight"
            echo "- Base publicada: \`$BASE_SHA\`"
            echo "- Candidata: \`$CANDIDATE_SHA\`"
            echo "- Impacto de banco: \`$DATABASE_IMPACT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$DATABASE_IMPACT" = critical && test "$DATABASE_CHANGES_APPROVED" != true; then
            echo "Mudanças críticas de banco exigem workflow_dispatch com approve_database_changes=true." >&2
            node -e "const m=require('./rastreon-release-manifest.json'); console.error(m.database.files.join('\\n'))"
            exit 1
          fi

      - name: Package release
        run: git archive --format=tar.gz --output=rastreon-release.tar.gz HEAD

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY_B64"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          STAFF_JOAO_EMAIL: ${{ secrets.STAFF_JOAO_EMAIL }}
          STAFF_JOAO_PASSWORD: ${{ secrets.STAFF_JOAO_PASSWORD }}
          STAFF_GUILHERME_EMAIL: ${{ secrets.STAFF_GUILHERME_EMAIL }}
          STAFF_GUILHERME_PASSWORD: ${{ secrets.STAFF_GUILHERME_PASSWORD }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          node -e "const fs=require('fs');const keys=['STAFF_JOAO_EMAIL','STAFF_JOAO_PASSWORD','STAFF_GUILHERME_EMAIL','STAFF_GUILHERME_PASSWORD'];const data=Object.fromEntries(keys.map(key=>[key,process.env[key]||'']));fs.writeFileSync('rastreon-staff.json',JSON.stringify(data),{mode:0o600})"
          scp -P "$VPS_PORT" rastreon-release.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/rastreon-release-${GITHUB_RUN_ID}.tar.gz"
          scp -P "$VPS_PORT" rastreon-staff.json \
            "$VPS_USER@$VPS_HOST:/tmp/rastreon-staff-${GITHUB_RUN_ID}.json"
          scp -P "$VPS_PORT" rastreon-release-manifest.json \
            "$VPS_USER@$VPS_HOST:/tmp/rastreon-release-manifest-${GITHUB_RUN_ID}.json"
          scp -P "$VPS_PORT" rastreon-published-manifest.json \
            "$VPS_USER@$VPS_HOST:/tmp/rastreon-published-manifest-${GITHUB_RUN_ID}.json"

      - name: Deploy tested release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          PROVISION_STAFF: ${{ inputs.provision_staff || false }}
          MANIFEST_BOOTSTRAP_APPROVED: ${{ inputs.approve_manifest_bootstrap || false }}
          SERVER_OVERWRITE_APPROVED: ${{ inputs.approve_server_overwrite || false }}
        run: |
          test -n "$VPS_APP_PATH"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            bash -se -- "$VPS_APP_PATH" "/tmp/rastreon-release-${GITHUB_RUN_ID}.tar.gz" "/tmp/rastreon-staff-${GITHUB_RUN_ID}.json" "/tmp/rastreon-release-manifest-${GITHUB_RUN_ID}.json" "$PROVISION_STAFF" "/tmp/rastreon-published-manifest-${GITHUB_RUN_ID}.json" "$MANIFEST_BOOTSTRAP_APPROVED" "$SERVER_OVERWRITE_APPROVED" <<'REMOTE'
          set -Eeuo pipefail
          APP_PATH="$1"
          ARCHIVE_PATH="$2"
          STAFF_PATH="$3"
          MANIFEST_PATH="$4"
          PROVISION_STAFF="$5"
          PUBLISHED_MANIFEST_PATH="$6"
          MANIFEST_BOOTSTRAP_APPROVED="$7"
          SERVER_OVERWRITE_APPROVED="${8:-false}"
          export NVM_DIR=/www/server/nvm
          test -s "$NVM_DIR/nvm.sh"
          . "$NVM_DIR/nvm.sh"
          nvm use 24 >/dev/null
          test "$(node --version | cut -d. -f1)" = v24
          cd "$APP_PATH"
          test "$APP_PATH" = /www/wwwroot/protec-veicular
          test -f .env
          if grep -q '^GEOCODING_PROVIDER=' .env; then
            sed -i 's/^GEOCODING_PROVIDER=.*/GEOCODING_PROVIDER=mapbox/' .env
          else
            printf '\nGEOCODING_PROVIDER=mapbox\n' >> .env
          fi
          case "$ARCHIVE_PATH" in
            /tmp/rastreon-release-*.tar.gz) ;;
            *) exit 1 ;;
          esac
          case "$STAFF_PATH" in
            /tmp/rastreon-staff-*.json) ;;
            *) exit 1 ;;
          esac
          case "$MANIFEST_PATH" in
            /tmp/rastreon-release-manifest-*.json) ;;
            *) exit 1 ;;
          esac
          case "$PUBLISHED_MANIFEST_PATH" in
            /tmp/rastreon-published-manifest-*.json) ;;
            *) exit 1 ;;
          esac
          test -f "$ARCHIVE_PATH"
          test -f "$STAFF_PATH"
          test -f "$MANIFEST_PATH"
          test -f "$PUBLISHED_MANIFEST_PATH"
          test -f package-lock.json
          test -f deploy/ecosystem.config.cjs
          # O backup usa a release atualmente ativa, antes que qualquer arquivo
          # de aplicação ou migration seja substituído.
          npm run db:backup
          RELEASE_DIR="$(mktemp -d /tmp/rastreon-release.XXXXXX)"
          trap 'rm -rf -- "$RELEASE_DIR"; rm -f -- "$ARCHIVE_PATH" "$STAFF_PATH" "$MANIFEST_PATH" "$PUBLISHED_MANIFEST_PATH"' EXIT
          tar -xzf "$ARCHIVE_PATH" -C "$RELEASE_DIR"
          if test -f .rastreon-release-manifest.json; then
            # Alterações feitas diretamente na VPS bloqueiam o deploy automático.
            # Só uma execução manual com approve_server_overwrite=true publica
            # por cima delas; o backup do banco já foi validado acima.
            if node "$RELEASE_DIR/deploy/release-manifest.mjs" verify \
              --root "$APP_PATH" \
              --manifest "$APP_PATH/.rastreon-release-manifest.json"; then
              echo "Release publicada íntegra; nenhuma alteração fora do fluxo."
            elif test "$SERVER_OVERWRITE_APPROVED" = true; then
              echo "Sobrescrita aprovada manualmente: os arquivos listados acima serão substituídos pela release."
            else
              echo "Execute manualmente com approve_server_overwrite=true para sobrescrever as alterações feitas na VPS." >&2
              exit 2
            fi
          else
            echo "Primeira release com manifesto: conferindo a VPS contra o último deploy bem-sucedido."
            if node "$RELEASE_DIR/deploy/release-manifest.mjs" verify \
              --root "$APP_PATH" \
              --manifest "$PUBLISHED_MANIFEST_PATH"; then
              echo "Estrutura legada coincide com a última release publicada."
            elif test "$MANIFEST_BOOTSTRAP_APPROVED" = true; then
              echo "Bootstrap do primeiro manifesto aprovado; banco, backups e .env serão preservados."
            else
              echo "A estrutura legada diverge; execute manualmente com approve_manifest_bootstrap=true." >&2
              exit 2
            fi
          fi
          rsync -a \
            --delete \
            --exclude=.env \
            --exclude=.git/ \
            --exclude=.rastreon-release-manifest.json \
            --exclude=backups/ \
            --exclude=data/ \
            --exclude=database/backups/ \
            --exclude=database/data/ \
            --exclude=node_modules/ \
            "$RELEASE_DIR/" "$APP_PATH/"
          npm ci --ignore-scripts
          npm run build
          DATABASE_IMPACT="$(node -e "const m=require('$MANIFEST_PATH'); process.stdout.write(m.database.requiresApproval?'critical':'none')")"
          if test "$DATABASE_IMPACT" = critical; then
            echo "Aplicando fase separada de banco após backup validado."
            npm run db:init
          else
            echo "Release sem mudança crítica de banco; fase de migration ignorada."
          fi
          if test "$PROVISION_STAFF" = true; then
            echo "Aplicando fase separada de provisionamento da equipe."
            STAFF_CONFIG_PATH="$STAFF_PATH" npm run staff:provision
          else
            echo "Provisionamento da equipe ignorado; nenhuma conta será alterada."
          fi
          npm prune --omit=dev --ignore-scripts
          # Recria o processo para que o PM2 sempre use o caminho organizado.
          pm2 delete protec-veicular >/dev/null 2>&1 || true
          pm2 delete rastreon >/dev/null 2>&1 || true
          pm2 start deploy/ecosystem.config.cjs --update-env
          pm2 save
          if ! curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/api/health >/dev/null; then
            pm2 describe protec-veicular || true
            pm2 logs protec-veicular --lines 80 --nostream || true
            exit 1
          fi
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/api/ready >/dev/null
          MAP_CONFIG="$(curl --fail --silent --show-error http://127.0.0.1:3000/map-config.js)"
          grep -Fq '"provider":"mapbox"' <<<"$MAP_CONFIG"
          grep -Fq 'mapbox://styles/joaomanoelpera/cmsyr2l11008201s978xy5yqg' <<<"$MAP_CONFIG"
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/vendor/mapbox/mapbox-gl.js >/dev/null
          install -m 600 "$MANIFEST_PATH" "$APP_PATH/.rastreon-release-manifest.json"
          REMOTE

      - name: Verify public endpoint
        env:
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: |
          test -n "$PUBLIC_HEALTH_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$PUBLIC_HEALTH_URL" >/dev/null
