<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1f33" />
    <title>Recuperar senha — Rastreon</title>
    <link rel="stylesheet" href="/css/style.css?v=20260820" />
    <link rel="stylesheet" href="/css/theme-home.css?v=20260820" />
    <link rel="stylesheet" href="/css/account-security.css?v=20260827-1" />
  </head>
  <body class="auth-page account-recovery-page">
    <main class="account-recovery-shell">
      <a href="/login.html" class="recovery-back">← Voltar para o login</a>
      <form id="recoveryRequestForm" class="auth-form account-recovery-card">
        <span class="login-kicker">RECUPERAÇÃO SEGURA</span>
        <h1>Redefina sua senha</h1>
        <p>Informe seu e-mail. A resposta será a mesma, exista ou não uma conta associada.</p>
        <label for="recoveryEmail">E-mail</label>
        <input id="recoveryEmail" type="email" autocomplete="email" maxlength="160" required />
        <button type="submit">Enviar código</button>
        <div id="recoveryStatus" class="form-error hidden" role="status" aria-live="polite"></div>
      </form>
      <form id="recoveryConfirmForm" class="auth-form account-recovery-card hidden">
        <span class="login-kicker">CÓDIGO DE USO ÚNICO</span>
        <h2>Escolha uma nova senha</h2>
        <label for="recoveryCode">Código de 6 dígitos</label>
        <input id="recoveryCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
        <label for="recoveryPassword">Nova senha</label>
        <input
          id="recoveryPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required
        />
        <button type="submit">Redefinir senha</button>
        <div id="recoveryConfirmStatus" class="form-error hidden" role="status"></div>
      </form>
    </main>
    <script src="/js/account-recovery.js"></script>
  </body>
</html>
