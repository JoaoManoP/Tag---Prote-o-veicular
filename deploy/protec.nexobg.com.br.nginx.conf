map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name protec.nexobg.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/protec-veicular;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name protec.nexobg.com.br;

    ssl_certificate /etc/letsencrypt/live/protec.nexobg.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protec.nexobg.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PROTEC_SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /www/wwwlogs/protec.nexobg.com.br.log;
    error_log /www/wwwlogs/protec.nexobg.com.br.error.log;

    location / {
        client_max_body_size 100k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }
}
